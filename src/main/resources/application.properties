spring.application.name=film-library

# База данных MySQL (запускается в Docker-контейнере).
# При запуске через docker compose адрес заменяется переменными окружения.
spring.datasource.url=jdbc:mysql://localhost:3306/filmlibrary?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=filmuser
spring.datasource.password=filmpass

# Hibernate создаёт и обновляет таблицы по сущностям
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
